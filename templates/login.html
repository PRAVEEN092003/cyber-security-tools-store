{% extends 'base.html' %}
{% block title %}Sign In — CYBER SECURITY TOOLS{% endblock %}

{% block content %}
<div class="container py-5 position-relative z-2" style="max-width: 480px;">

    <!-- Centered Cyber Auth Glass Card -->
    <div class="cs-glass-card p-4 p-md-5" style="border-color: rgba(0, 240, 255, 0.28);">

        <!-- Header Shield Graphic -->
        <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.7rem;">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h1 class="h3 fw-bold text-white mb-1">Identity Verification</h1>
            <p class="text-secondary small font-monospace mb-0">ENTER ACCESS CREDENTIALS</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" novalidate id="loginForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <!-- Email Field -->
            <div class="mb-3">
                <label for="loginEmail" class="form-label font-monospace small text-cs-accent">
                    <i class="bi bi-envelope-at me-1"></i>OPERATOR EMAIL
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-secondary" style="border-color: rgba(0, 240, 255, 0.18);">
                        <i class="bi bi-person"></i>
                    </span>
                    <input
                        type="email"
                        class="form-control border-start-0 ps-0"
                        id="loginEmail"
                        name="email"
                        value="{{ form_email }}"
                        required
                        autocomplete="email"
                        placeholder="operator@defense.local"
                    />
                </div>
            </div>

            <!-- Password Field -->
            <div class="mb-4">
                <label for="loginPassword" class="form-label font-monospace small text-cs-accent">
                    <i class="bi bi-key-fill me-1"></i>ACCESS KEY
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-secondary" style="border-color: rgba(0, 240, 255, 0.18);">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input
                        type="password"
                        class="form-control border-start-0 border-end-0 ps-0"
                        id="loginPassword"
                        name="password"
                        required
                        autocomplete="current-password"
                        placeholder="••••••••••••"
                    />
                    <button class="btn btn-outline-secondary border-start-0 text-secondary bg-transparent toggle-password-btn"
                            type="button" style="border-color: rgba(0, 240, 255, 0.18);" tabindex="-1" aria-label="Toggle password visibility">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-cs btn-lg" id="loginSubmit">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Authenticate Session
                </button>
            </div>
        </form>

        <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
            <p class="text-secondary small mb-0">
                New security operator?
                <a href="{{ url_for('auth.register') }}" class="text-cs-accent fw-semibold" id="goToRegister">Initialize Account</a>
            </p>
        </div>

    </div>

</div>
{% endblock %}
